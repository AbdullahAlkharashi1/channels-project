services:
  postgres:
    image: postgres:16-alpine
    container_name: channels-db
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "5434:5432"
    volumes:
      - channels-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  channels-pgdata:
